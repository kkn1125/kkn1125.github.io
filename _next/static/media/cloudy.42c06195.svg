<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#D7DBE3"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- back cloud -->
  <g opacity="0.6">
    <ellipse cx="110" cy="140" rx="60" ry="30" fill="url(#cloudGrad)"/>
    <circle cx="80" cy="130" r="25" fill="url(#cloudGrad)"/>
    <circle cx="140" cy="125" r="30" fill="url(#cloudGrad)"/>
  </g>

  <!-- front cloud -->
  <g filter="url(#softShadow)">
    <ellipse cx="140" cy="150" rx="70" ry="35" fill="url(#cloudGrad)"/>
    <circle cx="110" cy="140" r="28" fill="url(#cloudGrad)"/>
    <circle cx="170" cy="135" r="35" fill="url(#cloudGrad)"/>
  </g>

  <!-- subtle highlight -->
  <ellipse cx="120" cy="135" rx="25" ry="12" fill="#FFFFFF" opacity="0.4"/>
</svg>
