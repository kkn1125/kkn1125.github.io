<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- pastel lime-orange mix -->
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5B5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F4B97A" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2A8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0AE72" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAF7C0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A866" stop-opacity="0.05"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6C87A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D6C87A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- larger circles (same zigzag positions) -->
  <circle cx="90" cy="80" r="52" fill="url(#g1)"/>
  <circle cx="150" cy="130" r="38" fill="url(#g2)"/>
  <circle cx="100" cy="180" r="46" fill="url(#g3)"/>

  <!-- vertical fading lines -->
  <g stroke="url(#lineGrad)" stroke-width="1.5">
    <!-- first -->
    <line x1="90" y1="28" x2="90" y2="0"/>
    <line x1="75" y1="38" x2="75" y2="8"/>
    <line x1="105" y1="38" x2="105" y2="8"/>

    <!-- second -->
    <line x1="150" y1="90" x2="150" y2="60"/>
    <line x1="135" y1="100" x2="135" y2="70"/>
    <line x1="165" y1="100" x2="165" y2="70"/>

    <!-- third -->
    <line x1="100" y1="134" x2="100" y2="100"/>
    <line x1="85" y1="145" x2="85" y2="110"/>
    <line x1="115" y1="145" x2="115" y2="110"/>
  </g>
</svg>
